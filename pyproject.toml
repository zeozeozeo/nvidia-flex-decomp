[project]
name = "flexkit"
version = "0.1.0"
description = "FleX 1.2.0 decompilation framework toolchain"
requires-python = ">=3.12"
dependencies = ["pyelftools>=0.33"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]
